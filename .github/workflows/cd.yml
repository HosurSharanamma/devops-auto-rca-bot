name: CD - deploy to EKS

# Deliberately MANUAL ONLY (workflow_dispatch), never automatic on push.
# Why: the EKS cluster is destroyed at the end of every session (cost
# discipline) and only exists while you're actively working. An
# auto-deploy-on-push workflow would fail most of the time (no cluster to
# deploy to) and, worse, would be a trap the one time it DID succeed by
# coincidentally running while the cluster happened to be up. You trigger
# this by hand, from the Actions tab, only after `terraform apply` has
# given you a live cluster for the session.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (a commit SHA from a CI run, or 'latest')"
        required: true
        default: "latest"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  CLUSTER_NAME: auto-rca-bot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0" # match the cluster version (terraform/variables.tf)

      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Look up the ECR registry for this account
        id: ecr
        run: echo "registry=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"

      # Day 6: closes the Day 4 gap "CD fails on a fresh cluster until
      # someone creates the secret by hand". The Groq key lives in GitHub
      # (Settings -> Secrets and variables -> Actions -> Secrets ->
      # LLM_API_KEY), is masked in logs, and is written to Kubernetes with
      # apply (create-or-update), so re-runs and key rotation both work.
      - name: Create namespace and LLM secret
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::GitHub secret LLM_API_KEY is empty or not set."
            exit 1
          fi
          kubectl apply -f k8s/00-namespace.yaml
          kubectl create secret generic auto-rca-bot-secrets \
            --from-literal=LLM_API_KEY="$LLM_API_KEY" \
            -n auto-rca-bot --dry-run=client -o yaml | kubectl apply -f -

      # Day 6: apply ALL manifests (not just `set image`), so config changes
      # and new components like Prometheus are deployed by the pipeline too.
      # The manifests say ":latest"; we swap in the chosen tag before
      # applying, so one apply = one rollout of exactly that image.
      - name: Apply manifests with the chosen tag
        run: |
          mkdir -p rendered
          for f in k8s/*.yaml; do
            sed "s#:latest#:${{ inputs.image_tag }}#g" "$f" > "rendered/$(basename "$f")"
          done
          grep -h "image:" rendered/*.yaml
          kubectl apply -f rendered/

      - name: Wait for rollout to finish
        run: |
          kubectl rollout status deployment/auto-rca-bot-api -n auto-rca-bot --timeout=240s
          kubectl rollout status deployment/auto-rca-bot-ui -n auto-rca-bot --timeout=180s
          kubectl rollout status deployment/prometheus -n auto-rca-bot --timeout=120s

      # Day 6: "rollout finished" only means pods passed their probes. This
      # checks the things a user and Prometheus actually depend on.
      - name: Smoke test
        run: |
          kubectl port-forward svc/auto-rca-bot-api 8000:8000 -n auto-rca-bot >/tmp/pf.log 2>&1 &
          sleep 5
          curl -sf http://localhost:8000/health
          echo
          curl -sf http://localhost:8000/metrics | grep -q "rca_request_duration_seconds" \
            || { echo "::error::/metrics does not expose rca_request_duration_seconds"; exit 1; }
          echo "API health and /metrics OK"

      - name: Summary
        run: |
          echo "### Deployed tag \`${{ inputs.image_tag }}\` to EKS" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n auto-rca-bot >> $GITHUB_STEP_SUMMARY
