# Day 9: one place for pytest settings (used locally and in CI).
[pytest]
testpaths = tests
# Repo root on the import path, so tests don't need sys.path hacks.
pythonpath = .
# -ra: short summary of every non-passing test at the end.
# --strict-markers: a typo in a marker name is an error, not a silent new marker.
addopts = -ra --strict-markers
markers =
    unit: pure logic, no web app and no network (fast)
    api: goes through the real FastAPI app with TestClient
    llm: LLM call handling (faked provider: rate limits, errors, bad answers)
    pii: secrets / personal data masking
    metrics: Prometheus metrics
