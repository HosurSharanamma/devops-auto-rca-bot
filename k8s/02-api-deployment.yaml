apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-rca-bot-api
  namespace: auto-rca-bot
  labels:
    app: auto-rca-bot-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-rca-bot-api
  template:
    metadata:
      labels:
        app: auto-rca-bot-api
      # Day 6: Prometheus (06-prometheus.yaml) finds pods to scrape by these
      # annotations, not by a hard-coded address -- so if replicas go from 1
      # to 3, all 3 pods get scraped automatically.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          # ECR_REGISTRY is replaced at deploy time (CD workflow), so no AWS
          # account ID is committed. See k8s/README.md for the manual command.
          image: ECR_REGISTRY/auto-rca-bot-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: auto-rca-bot-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auto-rca-bot-secrets
                  key: LLM_API_KEY
          # Requests/limits sized to actually fit on a single t3.medium node
          # (4GiB RAM, 2 vCPU, minus what kube-system/aws-node/coredns
          # already reserve) alongside the UI pod -- not arbitrary numbers.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "900Mi"
          # Day 8: three probes, none of them calls Groq.
          #  startup   -> /livez: gives the process up to 60 s to start;
          #               liveness is not checked until this passes.
          #  liveness  -> /livez: restart only if the process itself is hung.
          #  readiness -> /readyz: no traffic until warm-up (model loaded +
          #               one retrieval) succeeded -> no 17 s first request.
          # Before Day 8 both probes used /health, which calls Groq with a
          # 3 s + 3 s timeout inside a 5 s probe timeout: a slow Groq could
          # fail liveness and restart a healthy pod.
          startupProbe:
            httpGet:
              path: /livez
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
