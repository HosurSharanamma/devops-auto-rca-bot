# Local sanity check ONLY -- this is not what runs on EKS, it's how you
# prove the containers work correctly *before* touching AWS at all.
#
# Usage:
#   1. Get a free API key at https://console.groq.com
#   2. export LLM_API_KEY=your_key_here
#   3. docker compose up --build
#   4. UI at http://localhost:8501, API at http://localhost:8000/health
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      LM_STUDIO_BASE_URL: "https://api.groq.com/openai/v1"
      LM_STUDIO_MODEL: "llama-3.1-8b-instant"  # verify current model name in the Groq console
      LLM_API_KEY: "${LLM_API_KEY}"

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    ports:
      - "8501:8501"
    environment:
      RCA_API_BASE_URL: "http://api:8000"
    depends_on:
      - api
